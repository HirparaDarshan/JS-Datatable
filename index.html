<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/datatables.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">


</head>

<body>
<section class="form-section">
    <div class="container border border-5 mt-5 p-5 w-50">
        <h2 class="d-flex justify-content-center mb-5"> Registration Form</h2>
       
        <form id="datatable-form" action="#" method="post">

            <!-- Email -->
            <div class="input-group mb-3">
                <span class="input-group-addon"><i class="glyphicon glyphicon-envelope"></i></span>
                <input id="email" type="email" class="form-control" name="email" placeholder="Email">
            </div>
             <p id="email-message" class="text-danger"></p>

            <!-- Name -->
            <div class="mb-3 d-flex gap-3">
                <div class="input-group">
                    <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                    <input id="fname" type="text" class="form-control" name="fname" placeholder="Full Name">
                </div>
            </div>
            <p id="name-msg" class="text-danger"></p>

            <!-- gender Radio Button  -->
            <div class="d-flex gap-3 mb-3" id="gender">
                <input type="radio" class="form-check-input" id="male" name="optradio" value="male">Male
                <label class="form-check-label" for="male"></label>
                <input type="radio" class="form-check-input" id="female" name="optradio" value="female">Female
                <label class="form-check-label" for="female"></label>
            </div>
            <p id="malefemale-msg" class="text-danger"></p>

            <!-- country Dropdown  -->
             
            <select class="form-select mb-3 fs-4" aria-label="Countryselector" id="country" name="country">
                <option value = "0" selected disabled>Select a country</option>
                <option value="India">India</option>
                <option value="Pakistan">Pakistan</option>
                <option value="Australia">Australia</option>
            </select>
            <p id="country-msg" class="text-danger"></p>

            <!-- hobbies -->
             <fieldset>
                <legend class="fs-4">Select your sports:</legend>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="cricket" name="hobbies" value="Cricket">
                    <label class="form-check-label" for="cricket"> Cricket</label>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="football" name="hobbies" value="football">
                    <label class="form-check-label" for="football">Football</label>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="tennis" name="hobbies" value="tennis">
                    <label class="form-check-label" for="tennis">Tennis</label>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="basketball" name="hobbies" value="basketball">
                    <label class="form-check-label" for="basketball">Basketball</label>
                </div>
                <p id="hobbies-msg" class="text-danger"></p>
            </fieldset>

            <!-- Text Area -->
            <div class="mb-3">
                <label for="about" class="form-label">About:</label>
                <textarea class="form-control" id="about" rows="3"></textarea>
            </div>

            <!-- register button -->
            <div >
                <button type="submit" id="register" class="btn btn-warning">Submit</button>
            </div>
        </form>
    </div>
</section>

<section>
     <!-- Data table -->
        <table id="DataTable" class="display">
            <thead>
                <tr>
                    <th>Sr. No.</th>
                    <th>Email</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Country</th>
                    <th>Sports</th>
                    <th>About</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
</section>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/jquery.validate.js"></script>
    <script src="js/jquery-form-datatable.js"></script>
     <script src="js/datatables.js"></script>
</body>

</html>
